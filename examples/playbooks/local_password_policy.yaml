---
- name: Example playbook for managing the local password policy
  hosts: opengear
  gather_facts: false

  tasks:
    - name: Gather local_password_policy facts
      opengear.ng.facts:
        gather_network_resources:
          - local_password_policy

    - name: Show current local password policy
      ansible.builtin.debug:
        var: ansible_network_resources.local_password_policy

    - name: Enforce password complexity (merged)
      opengear.ng.local_password_policy:
        config:
          password_complexity_enabled: true
          password_minimum_length: 10
          password_must_contain_upper_case: true
          password_must_contain_number: true
          password_must_contain_special: true
          password_disallow_username: true
        state: merged

    - name: Enable 90 day password expiry
      opengear.ng.local_password_policy:
        config:
          password_expiry_interval_enabled: true
          password_expiry_interval_days: 90
        state: merged

    - name: Set exact policy state
      opengear.ng.local_password_policy:
        config:
          password_complexity_enabled: true
          password_minimum_length: 8
        state: replaced

    - name: Disable password complexity enforcement
      opengear.ng.local_password_policy:
        config:
          password_complexity_enabled: false
        state: merged

    - name: Preview raising the minimum length (check + diff mode)
      opengear.ng.local_password_policy:
        config:
          password_minimum_length: 14
        state: merged
      check_mode: true
      diff: true
      register: policy_preview

    - name: Show previewed change
      ansible.builtin.debug:
        var: policy_preview.diff
      when: policy_preview.changed
